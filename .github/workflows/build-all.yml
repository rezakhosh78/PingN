name: release all platforms

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Numeric release tag (for example 7.25.6; used by WebAPI update metadata)
        required: true
        type: string
      release_name:
        description: GitHub release title (for example PingN-v7.25.6-PiN52)
        required: true
        type: string

permissions:
  actions: write
  contents: write

jobs:
  create-release:
    name: Create or update the release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Use a numeric release tag such as 7.25.6. The WebAPI embeds this value as its update version."
            exit 1
          fi
          if [[ -z "${RELEASE_NAME//[[:space:]]/}" ]]; then
            echo "Release name cannot be empty."
            exit 1
          fi
          if [[ -z "$GPG_PRIVATE_KEY" ]]; then
            echo "Add the GPG_PRIVATE_KEY repository secret before starting a signed release."
            exit 1
          fi

      - name: Create or rename release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          RELEASE_NAME: ${{ inputs.release_name }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_NAME" \
              --prerelease
          else
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_NAME" \
              --notes "Automated multi-platform PingN release." \
              --prerelease
          fi

  public-key:
    needs: create-release
    uses: ./.github/workflows/pub-key.yml
    with:
      release_tag: ${{ inputs.release_tag }}
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

  release-WebAPI:
    needs: create-release
    uses: ./.github/workflows/release-WebAPI.yml
    with:
      release_tag: ${{ inputs.release_tag }}
    secrets: inherit

  dispatch-builds:
    name: Dispatch builds for every supported platform
    needs: create-release
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_REF: ${{ github.ref_name }}
    steps:
      - name: Start platform build workflows
        shell: bash
        run: |
          set -euo pipefail

          dispatch_workflow() {
            local workflow_file="$1"
            local payload
            payload="$(jq -nc \
              --arg ref "$SOURCE_REF" \
              --arg release_tag "$RELEASE_TAG" \
              '{ref:$ref, inputs:{release_tag:$release_tag}}')"

            echo "Dispatching $workflow_file for $SOURCE_REF (release $RELEASE_TAG)"
            if ! curl --retry 3 --retry-all-errors -fsS -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/$workflow_file/dispatches" \
              -d "$payload"; then
              echo "::error::Failed to dispatch $workflow_file"
              failures+=("$workflow_file")
            fi
          }

          failures=()
          for workflow in \
            build-windows.yml \
            build-linux.yml \
            build-osx.yml \
            build-windows-desktop.yml \
            build-windows-x86.yml; do
            dispatch_workflow "$workflow"
          done

          if (( ${#failures[@]} > 0 )); then
            printf 'Some platform workflows could not be started: %s\n' "${failures[*]}"
            exit 1
          fi
