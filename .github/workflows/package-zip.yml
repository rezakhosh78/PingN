name: package and release Zip

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
      target: # windows linux macos windows-desktop
        required: true
        type: string
    secrets:
      GPG_PRIVATE_KEY:
        required: true

permissions:
  contents: write
  actions: read

jobs:
  package:
    name: package x64 arm64
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    runs-on: ubuntu-latest
    env:
      Target: |- 
        ${{
          case(
            inputs.target == 'windows-desktop', 'windows',
            inputs.target
          )
        }}
      Arch: |-
        ${{
          case(
            matrix.arch == 'x64', '64',
            matrix.arch
          ) 
        }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Restore build artifacts
      uses: actions/download-artifact@v8
      with:
        name: ${{ matrix.arch }}
        path: PingN-${{ env.Target }}-${{ env.Arch }}
    
    - name: Download and merge core bundle
      shell: bash
      run: |
        set -euo pipefail
        core_archive="$RUNNER_TEMP/v2rayN-$Target-$Arch-core.zip"
        core_extract="$RUNNER_TEMP/v2rayN-$Target-$Arch-core"
        core_bin="$core_extract/v2rayN-$Target-$Arch/bin"
        target_bin="PingN-$Target-$Arch/bin"

        wget -nv -O "$core_archive" "https://github.com/2dust/v2rayN-core-bin/raw/refs/heads/master/v2rayN-$Target-$Arch.zip"
        7z x -y "$core_archive" "-o$core_extract" >/dev/null
        if [[ ! -d "$core_bin" ]]; then
          echo "::error::Core bundle is missing its expected bin directory: $core_bin"
          exit 1
        fi
        mkdir -p "$target_bin"
        cp -a "$core_bin/." "$target_bin/"

    - name: Package zip archive
      shell: bash
      run: |
        set -euo pipefail
        archive="PingN-$Target-$Arch.zip"
        rm -f "$archive"
        7z a -tZip "$archive" "PingN-$Target-$Arch" -mx1

    - name: Rename windows-desktop 
      if: inputs.target == 'windows-desktop'
      run: mv "PingN-$Target-$Arch.zip" "PingN-$Target-$Arch-desktop.zip"
    
    - name: Upload zip artifact
      uses: actions/upload-artifact@v7
      with:
        name: release-${{ inputs.target }}-${{ matrix.arch }}
        path: PingN*.zip
        if-no-files-found: error

  release:
    name: sign and upload zip x64 arm64
    needs: package
    strategy:
      matrix:
        arch: [ x64, arm64 ]
    uses: ./.github/workflows/upload-sign.yml
    with:
      release_tag: ${{ inputs.release_tag }}
      artifact_name: release-${{ inputs.target }}-${{ matrix.arch }}
      file_pattern: '*.zip'
    secrets:
      GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
